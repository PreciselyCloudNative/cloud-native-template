version: '3.8'

services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile
    image: precisely-cloud-native:latest
    container_name: precisely-cloud-native
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - PRECISELY_API_KEY=${PRECISELY_API_KEY}
      - USE_LLM_EXTRACTION=${USE_LLM_EXTRACTION:-false}
      - GLINER_SERVICE_URL=${GLINER_SERVICE_URL:-http://gliner-service:5001}
    env_file:
      - ../.env.docker
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - app-network

  # Optional: GLiNER service (uncomment if using address extraction)
  # gliner-service:
  #   image: gliner-address-locator:latest
  #   container_name: gliner-service
  #   ports:
  #     - "5001:5001"
  #   environment:
  #     - FLASK_ENV=production
  #     - PORT=5001
  #   networks:
  #     - app-network

networks:
  app-network:
    driver: bridge
